# ===== Docker Compose Configuration — Bài tập 2 (Buổi 11 & 12) =====
# Sinh viên: Nguyễn Minh Phú — MSSV: 2374802013447
# Dựng toàn bộ hệ thống bằng 1 lệnh duy nhất: docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcrm_warranty_hub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET=${JWT_SECRET:-smart-crm-warranty-hub-se-hk261-secret-key-2026}
    volumes:
      # Gắn kết thư mục CSDL để bảo lưu dữ liệu (Data Persistence)
      - ./db:/app/db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
