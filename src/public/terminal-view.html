<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Windows Terminal — PowerShell</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1e1e1e;
            font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .window {
            width: 1200px;
            background-color: #0c0c0c;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Windows Terminal Titlebar */
        .titlebar {
            height: 40px;
            background-color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            user-select: none;
        }
        .tabs {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .tab {
            background-color: #0c0c0c;
            height: 32px;
            padding: 0 16px;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #cccccc;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            margin-top: 8px;
        }
        .tab svg {
            width: 14px;
            height: 14px;
        }
        .tab-close {
            color: #888888;
            font-size: 14px;
            margin-left: 6px;
        }
        .tab-add {
            color: #888888;
            padding: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .window-controls {
            display: flex;
            height: 100%;
        }
        .win-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
            font-size: 12px;
        }
        .win-close:hover {
            background-color: #e81123;
            color: #ffffff;
        }
        .win-btn:hover:not(.win-close) {
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Terminal Body */
        .terminal {
            padding: 20px 24px 30px 24px;
            color: #cccccc;
            font-size: 14px;
            line-height: 1.5;
            min-height: 520px;
            background-color: #0c0c0c;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .prompt {
            color: #ffffff;
            font-weight: 600;
        }
        .prompt-path {
            color: #ffffff;
        }
        .command {
            color: #ffff55;
            font-weight: 600;
        }
        .c-cyan { color: #5bc0de; }
        .c-green { color: #5cb85c; }
        .c-yellow { color: #f0ad4e; }
        .c-red { color: #d9534f; }
        .c-gray { color: #777777; }
        .c-white { color: #ffffff; }
        .c-blue { color: #337ab7; }

        .banner {
            color: #aaaaaa;
            margin-bottom: 16px;
        }

        /* Status badge */
        .tc-header-badge {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid #2563eb;
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 14px;
            font-weight: 600;
        }
        .tc-pass-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-top: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="titlebar">
        <div class="tabs">
